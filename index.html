    d.className = 'opt';
    d.id = 'bo-' + o.k;
    d.dataset.k = o.k;
    d.innerHTML = '<span class="key">' + o.k + '</span><span>' + o.v + '</span>';
    d.addEventListener('click', () => answerBrowse(o.k, d));
    box.appendChild(d);
  });
  }
  document.getElementById('browseAns').classList.remove('show');
  document.getElementById('browseAns').textContent = '✅ 答案：' + q.ans.split('').join('、');
  revealed = false;
  document.getElementById('revealBtn').textContent = '显示答案';
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').disabled = (idx === total - 1);
  document.getElementById('browseProgress').style.width = ((idx+1)/total*100) + '%';
  window.scrollTo(0, 0);
}
/* 背题模式: 点击选项作答, 按全局反馈方式提示对错/正确答案 */
function answerBrowse(k, el) {
  if (revealed) return;
  revealed = true;
  const q = QUESTIONS[idx];
  const correct = q.ans.split('');
  const isRight = correct.includes(k);
  if (feedbackMode === 'full') {
    document.querySelectorAll('#browseOpts .opt').forEach(o => {
      if (correct.includes(o.dataset.k)) o.classList.add('correct');
    });
  }
  if (isRight) {
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    wrongSet.add(idx);   // 记入错题本
  }
  const msg = (feedbackMode === 'full')
    ? '✅ 正确答案：' + correct.join('、')
    : (isRight ? '✅ 答对啦！' : '❌ 答错了');
  document.getElementById('browseAns').textContent = msg;
  document.getElementById('browseAns').classList.add('show');
  document.getElementById('revealBtn').textContent = '已作答';
}
function reveal() {
  const q = QUESTIONS[idx];
  document.getElementById('browseAns').classList.add('show');
  q.ans.split('').forEach(a => {
    const el = document.getElementById('bo-' + a);
    if (el) { el.classList.add('correct'); }
  });
  revealed = true;
  document.getElementById('revealBtn').textContent = '已显示答案';
}
document.getElementById('revealBtn').addEventListener('click', () => { if(!revealed) reveal(); });
document.getElementById('prevBtn').addEventListener('click', () => { if(idx>0){ idx--; renderBrowse(); } });
document.getElementById('nextBtn').addEventListener('click', () => { if(idx<total-1){ idx++; renderBrowse(); } });
document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = parseInt(document.getElementById('jumpInput').value, 10);
  if (v >= 1 && v <= total) { idx = v - 1; renderBrowse(); }
});
document.getElementById('jumpInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('jumpBtn').click();
});

/* ---------- 随机自测 ---------- */
let quiz = [], qi = 0, score = 0, answered = false, wrongList = [];
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function startQuiz() {
  const n = parseInt(document.getElementById('quizCount').value, 10);
  quiz = shuffle(QUESTIONS);
  if (n > 0) quiz = quiz.slice(0, n);
  qi = 0; score = 0; wrongList = [];
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('quizBody').style.display = 'block';
  document.getElementById('quizResult').style.display = 'none';
  renderQuiz();
}
function renderQuiz() {
  const q = quiz[qi];
  answered = false;
  document.getElementById('quizQnum').innerHTML = '第 ' + (qi+1) + ' / ' + quiz.length + ' 题' + (q.ans.length>1 ? '<span class="tag multi">多选</span>' : '');
  document.getElementById('quizStem').textContent = q.stem;
  document.getElementById('quizInfo').textContent = '已答 ' + qi + ' 题';
  document.getElementById('quizScoreLive').textContent = '✅ ' + score + '  ❌ ' + wrongList.length;
  const box = document.getElementById('quizOpts');
  box.innerHTML = '';
  if (q.noopts) {
    box.innerHTML = '<div style="font-size:13px;color:#b57a00;background:#fdf8ec;padding:10px;border-radius:8px">⚠️ 本题选项缺失,计入统计但无法作答</div>';
    answered = true;
    document.getElementById('quizAns').textContent = '✅ 正确答案：' + q.ans.split('').join('、');
    document.getElementById('quizAns').classList.add('show');
    document.getElementById('nextQBtn').style.display = 'block';
    document.getElementById('nextQBtn').textContent = (qi < quiz.length - 1) ? '下一题 ➡' : '查看成绩 🎯';
    document.getElementById('quizProgress').style.width = (qi/quiz.length*100) + '%';
    return;
  }
  q.opts.forEach(o => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.dataset.k = o.k;
    d.innerHTML = '<span class="key">' + o.k + '</span><span>' + o.v + '</span>';
    d.addEventListener('click', () => pick(o.k, d));
    box.appendChild(d);
  });
  document.getElementById('quizAns').classList.remove('show');
  document.getElementById('nextQBtn').style.display = 'none';
  document.getElementById('quizProgress').style.width = (qi/quiz.length*100) + '%';
  window.scrollTo(0, 0);
}
function pick(k, el) {
  if (answered) return;
  answered = true;
  const q = quiz[qi];
  const correct = q.ans.split('');
  const isRight = correct.includes(k);
  if (feedbackMode === 'full') {
    // 高亮所有正确选项 + 显示正确答案
    document.querySelectorAll('#quizOpts .opt').forEach(o => {
      if (correct.includes(o.dataset.k)) o.classList.add('correct');
    });
  }
  if (isRight) {
    score++;
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    wrongList.push(q.n);
    wrongSet.add(QUESTIONS.indexOf(q));   // 记入错题本
  }
  const msg = (feedbackMode === 'full')
    ? '✅ 正确答案：' + correct.join('、')
    : (isRight ? '✅ 答对啦！' : '❌ 答错了');
  document.getElementById('quizAns').textContent = msg;
  document.getElementById('quizAns').classList.add('show');
  document.getElementById('quizScoreLive').textContent = '✅ ' + score + '  ❌ ' + wrongList.length;
  if (qi < quiz.length - 1) {
    document.getElementById('nextQBtn').style.display = 'block';
  } else {
    document.getElementById('nextQBtn').style.display = 'block';
    document.getElementById('nextQBtn').textContent = '查看成绩 🎯';
  }
}
document.getElementById('nextQBtn').addEventListener('click', () => {
  if (qi < quiz.length - 1) { qi++; renderQuiz(); }
  else showResult();
});
function showResult() {
  document.getElementById('quizBody').style.display = 'none';
  const r = document.getElementById('quizResult');
  const pct = Math.round(score / quiz.length * 100);
  const msg = pct >= 90 ? '🏆 太强了！' : pct >= 70 ? '👍 不错，再巩固下' : pct >= 50 ? '📖 继续加油' : '💪 多刷几遍';
  let w = '';
  if (wrongList.length) {
    w = '<div class="score-detail">错题(点击可跳回复习): ' + wrongList.map(function(n){
      return '<a href="#" onclick="gotoQ(' + n + ');return false;" style="color:#2f6fed;text-decoration:none;font-weight:700">' + n + '</a>';
    }).join('、') + '</div>';
  }
  r.style.display = 'block';
  r.innerHTML = '<div class="score"><div class="big">' + pct + '%</div>' +
    '<div class="sub">答对 ' + score + ' / ' + quiz.length + ' 题 · ' + msg + '</div>' + w +
    '<button class="ok-btn" onclick="startQuiz()">🔁 再测一次</button></div>';
}
document.getElementById('startQuizBtn').addEventListener('click', startQuiz);

/* ---------- 反馈方式: 仅对错 / 对错+正确答案 ---------- */
let feedbackMode = 'full';
const fbJudge = document.getElementById('fbJudge');
const fbFull = document.getElementById('fbFull');
function setFeedback(mode) {
  feedbackMode = mode;
  fbJudge.classList.toggle('active', mode === 'judge');
  fbFull.classList.toggle('active', mode === 'full');
}
fbJudge.addEventListener('click', () => setFeedback('judge'));
fbFull.addEventListener('click', () => setFeedback('full'));

/* ---------- 错题复习 ---------- */
const wrongSet = new Set();   // 记录答错的题(QUESTIONS 下标)
let wrongIdx = 0, wrongAnswered = false;
function wrongListSorted() { return Array.from(wrongSet).sort((a, b) => a - b); }
function renderWrong() {
  const list = wrongListSorted();
  const empty = document.getElementById('wrongEmpty');
  const card = document.getElementById('wrongCard');
  const clearBtn = document.getElementById('wrongClearBtn');
  if (list.length === 0) {
    empty.style.display = 'block';
    card.style.display = 'none';
    clearBtn.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  card.style.display = 'block';
  clearBtn.style.display = 'inline-block';
  if (wrongIdx >= list.length) wrongIdx = list.length - 1;
  const q = QUESTIONS[list[wrongIdx]];
  document.getElementById('wrongQnum').innerHTML = '错题 ' + (wrongIdx + 1) + ' / ' + list.length +
    (q.ans.length > 1 ? '<span class="tag multi">多选</span>' : '');
  document.getElementById('wrongStem').textContent = q.stem;
  const box = document.getElementById('wrongOpts');
  box.innerHTML = '';
  q.opts.forEach(o => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.dataset.k = o.k;
    d.innerHTML = '<span class="key">' + o.k + '</span><span>' + o.v + '</span>';
    d.addEventListener('click', () => answerWrong(o.k, d));
    box.appendChild(d);
  });
  document.getElementById('wrongAns').classList.remove('show');
  document.getElementById('wrongAns').textContent = '✅ 答案：' + q.ans.split('').join('、');
  wrongAnswered = false;
  document.getElementById('wrongRevealBtn').textContent = '显示答案';
  document.getElementById('wrongPrevBtn').disabled = (wrongIdx === 0);
  document.getElementById('wrongNextBtn').disabled = (wrongIdx === list.length - 1);
  document.getElementById('wrongProgress').style.width = ((wrongIdx + 1) / list.length * 100) + '%';
  window.scrollTo(0, 0);
}
function answerWrong(k, el) {
  if (wrongAnswered) return;
  wrongAnswered = true;
  const q = QUESTIONS[wrongListSorted()[wrongIdx]];
  const correct = q.ans.split('');
  const isRight = correct.includes(k);
  if (feedbackMode === 'full') {
    document.querySelectorAll('#wrongOpts .opt').forEach(o => {
      if (correct.includes(o.dataset.k)) o.classList.add('correct');
    });
  }
  if (isRight) {
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    wrongSet.add(QUESTIONS.indexOf(q));   // 仍答错 -> 留在错题本
  }
  const msg = (feedbackMode === 'full')
    ? '✅ 正确答案：' + correct.join('、')
    : (isRight ? '✅ 答对啦！' : '❌ 答错了');
  document.getElementById('wrongAns').textContent = msg;
  document.getElementById('wrongAns').classList.add('show');
  document.getElementById('wrongRevealBtn').textContent = '已作答';
}
document.getElementById('wrongRevealBtn').addEventListener('click', () => {
  if (!wrongAnswered) {
    wrongAnswered = true;
    const q = QUESTIONS[wrongListSorted()[wrongIdx]];
    document.getElementById('wrongAns').textContent = '✅ 答案：' + q.ans.split('').join('、');
    document.getElementById('wrongAns').classList.add('show');
    document.getElementById('wrongRevealBtn').textContent = '已显示答案';
  }
});
document.getElementById('wrongPrevBtn').addEventListener('click', () => { if (wrongIdx > 0) { wrongIdx--; renderWrong(); } });
document.getElementById('wrongNextBtn').addEventListener('click', () => {
  const list = wrongListSorted();
  if (wrongIdx < list.length - 1) { wrongIdx++; renderWrong(); }
});
document.getElementById('wrongClearBtn').addEventListener('click', () => {
  wrongSet.clear(); wrongIdx = 0; renderWrong();
});

/* 从错题列表跳转到背题模式 */
function gotoQ(n) {
  switchMode('browse');
  idx = Math.max(0, Math.min(total - 1, n - 1));
  renderBrowse();
}

/* ---------- 模式切换 ---------- */
const modeBrowse = document.getElementById('modeBrowse');
const modeQuiz = document.getElementById('modeQuiz');
const modeWrong = document.getElementById('modeWrong');
const browseView = document.getElementById('browseView');
const quizView = document.getElementById('quizView');
const wrongView = document.getElementById('wrongView');
function switchMode(active) {
  modeBrowse.classList.toggle('active', active === 'browse');
  modeQuiz.classList.toggle('active', active === 'quiz');
  modeWrong.classList.toggle('active', active === 'wrong');
  browseView.style.display = (active === 'browse') ? 'block' : 'none';
  quizView.style.display = (active === 'quiz') ? 'block' : 'none';
  wrongView.style.display = (active === 'wrong') ? 'block' : 'none';
  if (active === 'wrong') renderWrong();
}
modeBrowse.addEventListener('click', () => switchMode('browse'));
modeQuiz.addEventListener('click', () => switchMode('quiz'));
modeWrong.addEventListener('click', () => switchMode('wrong'));

/* 键盘左右键 */
document.addEventListener('keydown', e => {
  if (browseView.style.display !== 'none') {
    if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
    if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  } else if (wrongView.style.display !== 'none') {
    if (e.key === 'ArrowLeft') document.getElementById('wrongPrevBtn').click();
    if (e.key === 'ArrowRight') document.getElementById('wrongNextBtn').click();
  }
});

renderBrowse();
</script>
